<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mak Mixology — Voucher</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            -webkit-font-smoothing: antialiased;
        }
        .logo {
            width: 140px;
            height: auto;
            margin: 10px 0 24px;
            border-radius: 12px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .status-icon {
            font-size: 64px;
            margin-bottom: 12px;
            line-height: 1;
        }
        .status-label {
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }
        .status-valid .status-label { color: #c9a84c; }
        .status-redeemed .status-label { color: #f44336; }
        .status-expired .status-label { color: #f44336; }
        .status-error .status-label { color: #999; }

        .detail {
            font-size: 15px;
            color: #ccc;
            margin: 8px 0;
            line-height: 1.5;
        }
        .detail strong {
            color: #c9a84c;
        }
        .voucher-code {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 700;
            color: #c9a84c;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 16px;
            margin: 16px auto;
            display: inline-block;
            letter-spacing: 2px;
        }
        .btn-redeem {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 24px;
            background: #b8762a;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-redeem:active {
            transform: scale(0.97);
            background: #96581a;
        }
        .btn-redeem:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }
        .drink-label {
            font-size: 14px;
            color: #c9a84c;
            margin-top: 8px;
            font-style: italic;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #c9a84c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            color: #888;
            font-size: 14px;
            margin-top: 12px;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #555;
            text-align: center;
        }
        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .confirm-overlay.active { display: flex; }
        .confirm-box {
            background: #1a1a1a;
            border: 2px solid #c9a84c;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .confirm-box p {
            font-size: 17px;
            margin-bottom: 24px;
            color: #fff;
            line-height: 1.5;
        }
        .confirm-btns {
            display: flex;
            gap: 12px;
        }
        .confirm-btns button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-yes {
            background: #b8762a;
            color: #fff;
        }
        .btn-no {
            background: #333;
            color: #ccc;
        }
        .success-anim {
            animation: pulse 0.4s ease-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .client-hint {
            margin-top: 20px;
            padding: 14px 16px;
            background: rgba(201,168,76,0.08);
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: 10px;
            font-size: 14px;
            color: #c9a84c;
            line-height: 1.6;
            font-style: italic;
        }
        .staff-input-group {
            margin-bottom: 16px;
        }
        .staff-input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #c9a84c;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 16px;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        .staff-input:focus {
            border-color: #c9a84c;
        }
        .staff-input::placeholder {
            color: #555;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .btn-verify {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            background: #c9a84c;
            color: #0a0a0a;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-verify:active {
            transform: scale(0.97);
            background: #a8893e;
        }
        .staff-badge {
            display: inline-block;
            background: rgba(201,168,76,0.12);
            border: 1px solid rgba(201,168,76,0.3);
            color: #c9a84c;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .pin-overlay {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.88); z-index: 200;
            justify-content: center; align-items: center; padding: 20px;
        }
        .pin-overlay.active { display: flex; }
        .pin-box {
            background: #1a1a1a; border: 2px solid #c9a84c;
            border-radius: 16px; padding: 28px 24px;
            max-width: 320px; width: 100%; text-align: center;
        }
        .pin-box p { font-size: 15px; color: #ccc; margin-bottom: 16px; }
        .pin-input {
            width: 100%; background: #111; border: 1px solid #c9a84c;
            color: #c9a84c; font-size: 28px; font-weight: 700;
            letter-spacing: 8px; text-align: center; padding: 12px;
            border-radius: 8px; outline: none; margin-bottom: 16px;
            -webkit-text-security: disc; box-sizing: border-box;
        }
        .pin-error { color: #f44336; font-size: 13px; margin-bottom: 12px; min-height: 18px; }
        .btn-staff {
            display: block; width: 100%; padding: 12px; margin-top: 16px;
            background: transparent; color: #555; font-size: 13px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid #333; border-radius: 10px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .qr-container {
            display: flex; flex-direction: column; align-items: center;
            margin: 18px auto 4px;
        }
        .qr-code {
            width: 180px; height: 180px;
            border: 2px solid #c9a84c; border-radius: 10px;
        }
        .qr-label {
            font-size: 13px; color: #c9a84c; margin-top: 8px;
            letter-spacing: 0.5px; text-align: center;
        }
    </style>
</head>
<body>

    <img src="https://customer-assets-wrfwihn1.emergentagent.net/wingman/ab8b1545-0aa4-4837-8712-9b3cb67e8e8c/attachments/7e20e7b277004d02960509162061f524_mak_logo.png"
         alt="Mak Mixology" class="logo">

    <div id="content">
        <div class="card" style="padding:40px 24px">
            <div class="spinner"></div>
            <div class="loading-text">Verifica voucher in corso…</div>
        </div>
    </div>

    <div id="confirmOverlay" class="confirm-overlay">
        <div class="confirm-box">
            <p>Confermi di voler <strong style="color:#c9a84c">riscattare</strong> questo voucher?<br>L'operazione non è reversibile.</p>
            <div class="confirm-btns">
                <button class="btn-no" onclick="closeConfirm()">Annulla</button>
                <button class="btn-yes" onclick="doRedeem()">Conferma</button>
            </div>
        </div>
    </div>

    <div class="footer">Mak Mixology — Galleria delle Vittorie, Palermo</div>

    <script>
        var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx1Ck35hUTsO_uKGZe7fcpgURCRnHmgvdkVyIkTxT_lm9eLSAw46wUI9BvQ-jOjQnoJ6A/exec';
        var currentCode = '';
        var jsonpCounter = 0;
        var isClientView = false;

        function getParam(name) {
            var url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function jsonpOnce(params, cbName, callback) {
            var url = APPS_SCRIPT_URL + '?' + params + '&callback=' + cbName;
            var tid = setTimeout(function() {
                window.removeEventListener('message', handler);
                try { if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe); } catch(e) {}
                callback(null);
            }, 12000);

            function handler(event) {
                if (event.data && event.data.type === cbName) {
                    clearTimeout(tid);
                    window.removeEventListener('message', handler);
                    try { if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe); } catch(e) {}
                    callback(event.data.result);
                }
            }
            window.addEventListener('message', handler);

            var iframe = document.createElement('iframe');
            iframe.sandbox = 'allow-scripts';
            iframe.style.cssText = 'display:none;width:0;height:0;border:0;position:absolute';

            var safeUrl = url.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
            var iframeHtml = '<!DOCTYPE html><html><body><script>' +
                'var u="' + safeUrl + '";' +
                'window["' + cbName + '"]=function(d){parent.postMessage({type:"' + cbName + '",result:d},"*");};' +
                'var s=document.createElement("script");' +
                's.src=u;' +
                's.onerror=function(){parent.postMessage({type:"' + cbName + '",result:{error:true,message:"Connessione fallita"}},"*");};' +
                'document.body.appendChild(s);' +
                '<\/script></body></html>';

            iframe.srcdoc = iframeHtml;
            document.body.appendChild(iframe);
        }

        function jsonp(params, callback) {
            var maxTries = 3;
            var attempt = 0;

            function tryOnce() {
                attempt++;
                var cbName = '_voucherCb' + (++jsonpCounter) + '_' + Date.now();
                jsonpOnce(params, cbName, function(result) {
                    if ((result === null || (result && result.error === true)) && attempt < maxTries) {
                        setTimeout(tryOnce, 500);
                    } else if (result === null || (result && result.error === true)) {
                        callback({ error: true, message: 'Timeout — controlla la connessione' });
                    } else {
                        callback(result);
                    }
                });
            }
            tryOnce();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            try {
                var parts = dateStr.split('-');
                if (parts.length === 3) {
                    return parts[2] + '/' + parts[1] + '/' + parts[0];
                }
                return dateStr;
            } catch(e) {
                return dateStr;
            }
        }

        function renderValid(data) {
            var html = '<div class="card status-valid success-anim">';
            html += '<div class="status-icon">✅</div>';
            html += '<div class="status-label">Voucher Valido</div>';
            html += '<div class="voucher-code">' + escHtml(currentCode) + '</div>';
            html += '<div class="detail"><strong>Cliente:</strong> ' + escHtml(data.nome || '—') + '</div>';
            html += '<div class="detail"><strong>Scadenza:</strong> ' + formatDate(data.scadenza) + '</div>';
            html += '<div class="drink-label">🍸 Drink omaggio di compleanno</div>';
            if (isClientView) {
                html += '<div class="client-hint">Mostra questa schermata al personale del Mak Mixology 🍹</div>';
                var qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=c9a84c&bgcolor=1a1a1a&margin=12&data=' + encodeURIComponent(window.location.href);
                html += '<div class="qr-container"><img src="' + qrUrl + '" class="qr-code" alt="QR Voucher"><p class="qr-label">📱 Fai scansionare al personale</p></div>';
                html += '<button class="btn-staff" onclick="showStaffPIN()">👤 Staff — Riscatta voucher</button>';
            } else {
                html += '<button class="btn-redeem" onclick="showConfirm()">✅ Segna come riscattato</button>';
            }
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderRedeemed(data) {
            var html = '<div class="card status-redeemed success-anim">';
            html += '<div class="status-icon">🔴</div>';
            html += '<div class="status-label">Già Riscattato</div>';
            html += '<div class="voucher-code">' + escHtml(currentCode) + '</div>';
            html += '<div class="detail"><strong>Cliente:</strong> ' + escHtml(data.nome || '—') + '</div>';
            html += '<div class="detail"><strong>Riscattato il:</strong> ' + formatDate(data.dataRiscatto) + '</div>';
            if (isClientView) {
                html += '<div class="client-hint" style="border-color:rgba(244,67,54,0.25);background:rgba(244,67,54,0.06);color:#f44336;">Questo voucher è già stato utilizzato.</div>';
            }
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderExpired(data) {
            var html = '<div class="card status-expired success-anim">';
            html += '<div class="status-icon">❌</div>';
            html += '<div class="status-label">Scaduto</div>';
            html += '<div class="voucher-code">' + escHtml(currentCode) + '</div>';
            html += '<div class="detail"><strong>Cliente:</strong> ' + escHtml(data.nome || '—') + '</div>';
            html += '<div class="detail"><strong>Scaduto il:</strong> ' + formatDate(data.scadenza) + '</div>';
            if (isClientView) {
                html += '<div class="client-hint" style="border-color:rgba(244,67,54,0.25);background:rgba(244,67,54,0.06);color:#f44336;">Questo voucher è scaduto. Contatta il Mak Mixology per info.</div>';
            }
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderError(msg) {
            var html = '<div class="card status-error success-anim">';
            html += '<div class="status-icon">⚠️</div>';
            html += '<div class="status-label">Errore</div>';
            html += '<div class="detail">' + escHtml(msg) + '</div>';
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderNotFound() {
            var html = '<div class="card status-error success-anim">';
            html += '<div class="status-icon">🚫</div>';
            html += '<div class="status-label">Voucher Non Valido</div>';
            html += '<div class="detail">Il codice inserito non corrisponde a nessun voucher attivo.</div>';
            html += '<div class="detail" style="margin-top:16px;color:#666;font-size:13px">Verifica il QR code o contatta la direzione.</div>';
            if (!isClientView) {
                html += '<button class="btn-verify" style="margin-top:20px;background:#333;color:#ccc" onclick="renderStaffView()">← Torna alla verifica</button>';
            }
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        function renderStaffView() {
            var html = '<div class="card">';
            html += '<div class="staff-badge">👤 Area Staff</div>';
            html += '<div class="detail" style="margin-bottom:20px;color:#888;font-size:13px">Inserisci il codice voucher del cliente</div>';
            html += '<div class="staff-input-group">';
            html += '<input type="text" id="staffCodeInput" class="staff-input" placeholder="MAK-XXXX-0000-XXXX" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false">';
            html += '</div>';
            html += '<button class="btn-verify" onclick="staffVerify()">Verifica voucher</button>';
            html += '</div>';
            document.getElementById('content').innerHTML = html;
            var inp = document.getElementById('staffCodeInput');
            if (inp) {
                inp.addEventListener('input', function() { this.value = this.value.toUpperCase(); });
                inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') staffVerify(); });
                inp.focus();
            }
        }

        function staffVerify() {
            var inp = document.getElementById('staffCodeInput');
            if (!inp) return;
            var code = inp.value.trim().toUpperCase();
            if (!code) return;
            currentCode = code;

            var html = '<div class="card" style="padding:40px 24px">';
            html += '<div class="spinner"></div>';
            html += '<div class="loading-text">Verifica voucher in corso…</div>';
            html += '</div>';
            document.getElementById('content').innerHTML = html;

            jsonp('action=check&code=' + encodeURIComponent(currentCode), function(data) {
                if (data && data.error) {
                    renderError(data.message || 'Errore di connessione.');
                    return;
                }
                if (!data || !data.status) {
                    renderNotFound();
                    return;
                }
                switch (data.status) {
                    case 'valid':
                        renderValid(data);
                        break;
                    case 'redeemed':
                        renderRedeemed(data);
                        break;
                    case 'expired':
                        renderExpired(data);
                        break;
                    case 'not_found':
                        renderNotFound();
                        break;
                    default:
                        renderError('Stato sconosciuto: ' + data.status);
                }
            });
        }

        function escHtml(str) {
            var d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function showConfirm() {
            document.getElementById('confirmOverlay').classList.add('active');
        }

        function closeConfirm() {
            document.getElementById('confirmOverlay').classList.remove('active');
        }

        function doRedeem() {
            closeConfirm();
            var btn = document.querySelector('.btn-redeem');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Riscatto in corso…';
            }
            jsonp('action=redeem&code=' + encodeURIComponent(currentCode), function(data) {
                if (data && data.success) {
                    var html = '<div class="card status-redeemed success-anim">';
                    html += '<div class="status-icon">🎉</div>';
                    html += '<div class="status-label" style="color:#c9a84c">Riscattato!</div>';
                    html += '<div class="voucher-code">' + escHtml(currentCode) + '</div>';
                    html += '<div class="detail" style="font-size:17px;color:#fff;margin-top:12px">Voucher riscattato con successo.<br>Offri il drink al cliente! 🍸</div>';
                    html += '<button class="btn-verify" style="margin-top:20px;background:#333;color:#ccc" onclick="renderStaffView()">← Verifica un altro voucher</button>';
                    html += '</div>';
                    document.getElementById('content').innerHTML = html;
                } else {
                    renderError(data.message || 'Errore durante il riscatto.');
                }
            });
        }


        var STAFF_PIN = '1250';

        function showStaffPIN() {
            document.getElementById('pinOverlay').classList.add('active');
            var inp = document.getElementById('pinInput');
            inp.value = '';
            document.getElementById('pinError').textContent = '';
            setTimeout(function(){ inp.focus(); }, 100);
            inp.onkeydown = function(e){ if(e.key==='Enter') verifyPIN(); };
        }

        function closePIN() {
            document.getElementById('pinOverlay').classList.remove('active');
        }

        function verifyPIN() {
            var entered = document.getElementById('pinInput').value.trim();
            if (entered === STAFF_PIN) {
                closePIN();
                var sb = document.querySelector('.btn-staff');
                if (sb) {
                    var btn = document.createElement('button');
                    btn.className = 'btn-redeem';
                    btn.textContent = '✅ Segna come riscattato';
                    btn.onclick = showConfirm;
                    sb.parentNode.replaceChild(btn, sb);
                }
            } else {
                document.getElementById('pinError').textContent = 'PIN errato. Riprova.';
                document.getElementById('pinInput').value = '';
                document.getElementById('pinInput').focus();
            }
        }

        // Init
        (function() {
            var code = getParam('v');
            if (code) {
                isClientView = true;
                currentCode = code.trim().toUpperCase();
                jsonp('action=check&code=' + encodeURIComponent(currentCode), function(data) {
                    if (data && data.error) {
                        renderError(data.message || 'Errore di connessione.');
                        return;
                    }
                    if (!data || !data.status) {
                        renderNotFound();
                        return;
                    }
                    switch (data.status) {
                        case 'valid':
                            renderValid(data);
                            break;
                        case 'redeemed':
                            renderRedeemed(data);
                            break;
                        case 'expired':
                            renderExpired(data);
                            break;
                        case 'not_found':
                            renderNotFound();
                            break;
                        default:
                            renderError('Stato sconosciuto: ' + data.status);
                    }
                });
            } else {
                isClientView = false;
                renderStaffView();
            }
        })();
    </script>

    <div id="pinOverlay" class="pin-overlay">
        <div class="pin-box">
            <div style="font-size:32px;margin-bottom:12px;">🔐</div>
            <p>Inserisci il PIN staff</p>
            <input type="password" inputmode="numeric" id="pinInput" class="pin-input" maxlength="4" autocomplete="off" placeholder="••••">
            <div class="pin-error" id="pinError"></div>
            <div class="confirm-btns" style="display:flex;gap:10px;margin-top:4px;">
                <button class="btn-no" onclick="closePIN()" style="flex:1;padding:12px;border-radius:10px;background:#222;color:#aaa;border:1px solid #444;font-weight:700;text-transform:uppercase;cursor:pointer;">Annulla</button>
                <button class="btn-yes" onclick="verifyPIN()" style="flex:1;padding:12px;border-radius:10px;background:#c9a84c;color:#000;border:none;font-weight:700;text-transform:uppercase;cursor:pointer;">Conferma</button>
            </div>
        </div>
    </div>
</body>
</html>
